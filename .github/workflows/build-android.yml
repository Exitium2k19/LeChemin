name: Construire l’APK Le Chemin

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0f688-lechemin
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Préparer Android
        uses: android-actions/setup-android@v4

      - name: Installer le SDK Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Installer les dépendances
        run: npm ci

      - name: Tester et produire les livrables web
        run: |
          npm test
          npm run generate:xlsx
          npm run cap:sync

      - name: Préparer la signature permanente
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "Le secret GitHub Actions $variable est absent." >&2
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/le-chemin-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          keytool -list -storetype PKCS12 -keystore "$keystore_path" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Construire l’APK installable signé
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Vérifier la signature de l’APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Déposer la clé dans le brouillon privé
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id=400888866
          asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --jq '.assets[] | select(.name == "le-chemin-release.p12") | .id')"
          if [ -n "$asset_id" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/x-pkcs12' \
            --data-binary "@$ANDROID_KEYSTORE_PATH" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=le-chemin-release.p12" \
            >/dev/null

      - name: Nommer le livrable
        run: |
          mkdir -p livrables
          cp android/app/build/outputs/apk/release/app-release.apk livrables/Le-Chemin.apk

      - name: Publier l’APK
        uses: actions/upload-artifact@v7
        with:
          name: Le-Chemin-APK
          path: livrables/Le-Chemin.apk
          if-no-files-found: error
          retention-days: 30

      - name: Ajouter l’APK à la branche de travail
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f livrables/Le-Chemin.apk
          git commit -m 'Générer l’APK Le Chemin' || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
