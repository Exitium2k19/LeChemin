name: Construire l’APK Le Chemin

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0f688-lechemin
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Préparer Android
        uses: android-actions/setup-android@v3

      - name: Installer le SDK Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Installer les dépendances
        run: npm ci

      - name: Tester et produire les livrables web
        run: |
          npm test
          npm run generate:xlsx
          npm run cap:sync

      - name: Construire l’APK installable
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Nommer le livrable
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Le-Chemin.apk

      - name: Publier l’APK
        uses: actions/upload-artifact@v4
        with:
          name: Le-Chemin-APK
          path: Le-Chemin.apk
          if-no-files-found: error
          retention-days: 30
